version: '3'

services:
    web:
        image: ghcr.io/gateway3b/ultimate-charades-frontend:latest
        pull_policy: always
        container_name: ultimate-charades-frontend
        ports:
            - 1001:80
    server:
        image: ghcr.io/gateway3b/ultimate-charades-backend:latest
        pull_policy: always
        container_name: ultimate-charades-backend
        ports:
            - 1002:8080
        environment:
            - PORT=8080
            - CORS_ORIGIN=https://ultimatecharades.gateway3.net

